# Grafana only. The database is a Tiger Cloud service — put its URL in .env as DATABASE_URL.
# Start: docker compose up -d --wait
#
# To run the database locally instead, layer the override:
#   docker compose -f compose.yaml -f compose.local.yaml up -d --wait
services:
  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana

volumes:
  grafana:
